<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习任务助手</title>
  <style>
    :root { --ink:#172033; --muted:#697386; --line:#e5e7eb; --brand:#5b5ce2; --soft:#f5f6ff; --good:#11875d; --danger:#c84b54; }
    * { box-sizing:border-box; } body { margin:0; font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--ink); background:#f7f8fc; }
    .shell { max-width:1180px; margin:0 auto; padding:28px 20px 56px; } header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    .brand { display:flex; gap:12px; align-items:center; } .mark { width:42px; height:42px; display:grid; place-items:center; border-radius:14px; background:linear-gradient(135deg,#7374f4,#4b4bc6); color:#fff; font-size:21px; box-shadow:0 10px 22px #5b5ce233; }
    h1,h2,h3,p { margin-top:0; } h1 { font-size:22px; margin-bottom:3px; } h2 { font-size:17px; margin-bottom:16px; } .subtitle,.hint { color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:1.08fr .92fr; gap:18px; } .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 8px 24px #1b25500a; }
    .wide { grid-column:1 / -1; } label { display:block; color:var(--muted); font-size:13px; margin:12px 0 6px; } input,textarea,select { width:100%; border:1px solid #dfe2ea; border-radius:10px; padding:10px 12px; font:inherit; background:#fff; } textarea { min-height:110px; resize:vertical; }
    button { border:0; border-radius:10px; padding:10px 14px; font:inherit; cursor:pointer; background:var(--brand); color:#fff; } button.secondary { color:var(--ink); background:var(--soft); } button.danger { color:var(--danger); background:#fff1f2; } button:disabled { opacity:.55; cursor:not-allowed; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; } .row { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:13px 0; border-bottom:1px solid var(--line); } .row:last-child { border-bottom:0; } .row strong { display:block; margin-bottom:4px; } .badge { display:inline-block; padding:3px 8px; border-radius:999px; background:var(--soft); color:var(--brand); font-size:12px; }
    .chat { min-height:160px; max-height:360px; overflow:auto; background:#fafbff; border-radius:12px; padding:12px; margin-bottom:12px; } .bubble { padding:10px 12px; border-radius:12px; margin:8px 0; white-space:pre-wrap; line-height:1.55; } .bubble.user { background:#e9e9ff; margin-left:12%; } .bubble.assistant { background:#fff; border:1px solid var(--line); margin-right:8%; }
    pre { white-space:pre-wrap; word-break:break-word; background:#101827; color:#d8e1f0; border-radius:10px; padding:12px; font-size:12px; max-height:230px; overflow:auto; } .notice { color:var(--danger); min-height:20px; font-size:13px; } .empty { color:var(--muted); font-size:13px; padding:12px 0; }
    .hidden { display:none; } .flash { display:none; margin:0 0 18px; padding:12px 14px; border-radius:10px; font-size:14px; } .flash.show { display:block; } .flash.success { background:#e8f7ef; color:#126b48; } .flash.error { background:#fff0f1; color:#a3313b; } .flash.info { background:#eef0ff; color:#4447a7; } @media (max-width:820px) { .grid { grid-template-columns:1fr; } .wide { grid-column:auto; } header { align-items:flex-start; gap:12px; } }
  </style>
</head>
<body>
<main class="shell">
  <header><div class="brand"><div class="mark">✦</div><div><h1>学习任务助手</h1><div class="subtitle">把任务、资料和 Agent 对话放在一个工作台里</div></div></div><button id="logout" class="secondary hidden">退出登录</button></header>
  <div id="flash" class="flash" role="status" aria-live="polite"></div>
  <section id="auth-card" class="card"><h2 id="auth-title">登录</h2><div class="subtitle">登录后才能访问自己的任务和资料。</div><label>用户名</label><input id="username" autocomplete="username"><label>密码</label><input id="password" type="password" autocomplete="current-password"><div id="confirm-wrap" class="hidden"><label>确认密码</label><input id="confirm-password" type="password" autocomplete="new-password"></div><div class="actions"><button id="login">登录</button><button id="register" class="secondary">注册账号</button><button id="back-login" class="secondary hidden">返回登录</button></div><div id="auth-msg" class="notice"></div></section>
  <section id="workspace" class="grid hidden">
    <section class="card"><h2>我的任务</h2><div id="tasks" class="empty">正在加载…</div><div class="actions"><button id="refresh-tasks" class="secondary">刷新任务</button></div></section>
    <section class="card"><h2>资料库</h2><label>上传 Markdown 或纯文本</label><input id="document-file" type="file" accept=".md,.txt,text/markdown,text/plain"><div class="hint">文件名会作为资料来源，正文会被解析并切块。</div><div class="actions"><button id="upload">上传资料</button><button id="refresh-docs" class="secondary">刷新资料</button></div><div id="docs" class="empty"></div></section>
    <section class="card wide"><h2>Agent 工作台</h2><div id="chat" class="chat"><div class="empty">问我你的任务或资料库中的内容。</div></div><div class="actions"><input id="question" placeholder="例如：总结我资料库中关于 Agent 权限的内容" style="flex:1;min-width:220px"><button id="ask">发送</button></div><div id="agent-msg" class="notice"></div><details><summary class="hint">查看本次运行 trace</summary><pre id="trace">尚未运行</pre></details><div id="proposals"></div></section>
  </section>
</main>
<script>
const $ = id => document.getElementById(id); let token = localStorage.getItem('study_token'); let authMode='login'; let flashTimer;
function show(id, visible=true) { $(id).classList.toggle('hidden', !visible); }
function message(id, text) { $(id).textContent = text || ''; }
function flash(text,type='success') { const n=$('flash'); n.textContent=text; n.className=`flash show ${type}`; clearTimeout(flashTimer); flashTimer=setTimeout(()=>{n.className='flash';n.textContent=''},3500); }
function formatError(data,fallback) { if(Array.isArray(data?.detail)) return data.detail.map(x=>x?.msg||x).join('；'); return data?.detail || fallback; }
async function request(path, options={}) { const headers = {'Content-Type':'application/json', ...(options.headers||{})}; if (options.body instanceof FormData) delete headers['Content-Type']; if (token) headers.Authorization = `Bearer ${token}`; const response = await fetch(path, {...options, headers}); let data=null; try { data=await response.json(); } catch (_) {} if (!response.ok) throw new Error(formatError(data,`请求失败（${response.status}）`)); return data; }
function setAuthMode(mode) { authMode=mode; const register=mode==='register'; $('auth-title').textContent=register?'注册账号':'登录'; show('confirm-wrap',register); show('login',!register); show('register',!register); show('back-login',register); }
function setLoggedIn() { show('auth-card', false); show('workspace', true); show('logout', true); loadTasks(); loadDocs(); }
async function login() { message('auth-msg',''); try { const username=$('username').value.trim(), password=$('password').value; if(authMode==='register') { if(password!==$('confirm-password').value) throw new Error('两次输入的密码不一致'); await request('/auth/register',{method:'POST',body:JSON.stringify({username,password})}); flash('注册成功，请使用新账号登录','success'); setAuthMode('login'); return; } const body=new URLSearchParams({username,password}); const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}); const data=await r.json(); if(!r.ok) throw new Error(formatError(data,'登录失败')); token=data.access_token; localStorage.setItem('study_token',token); flash('登录成功','success'); setLoggedIn(); } catch(e) { flash(e.message,'error'); message('auth-msg',e.message); } }
async function loadTasks() { try { const data=await request('/tasks'); $('tasks').innerHTML=data.length?data.map(t=>`<div class="row"><div><strong>${escapeHtml(t.title)}</strong><span class="badge">${t.status} · ${t.priority}</span></div><div class="actions"><button class="secondary" onclick="completeTask(${t.id})">完成</button><button class="danger" onclick="deleteTask(${t.id})">删除</button></div></div>`).join(''):'<div class="empty">还没有任务</div>'; flash('任务已刷新'); } catch(e){flash(e.message,'error')} }
async function completeTask(id) { try { await request(`/tasks/${id}`,{method:'PATCH',body:JSON.stringify({status:'completed'})}); await loadTasks(); flash('任务已完成'); } catch(e){flash(e.message,'error')} }
async function deleteTask(id) { try { await request(`/tasks/${id}`,{method:'DELETE'}); await loadTasks(); flash('任务已删除'); } catch(e){flash(e.message,'error')} }
async function loadDocs() { try { const data=await request('/documents'); $('docs').innerHTML=data.length?data.map(d=>`<div class="row"><div><strong>${escapeHtml(d.source)}</strong><span class="badge">${d.state} · ${d.document_version}</span></div><button class="danger" onclick="deleteDoc('${d.id}')">删除</button></div>`).join(''):'<div class="empty">还没有资料</div>'; flash('资料已刷新'); } catch(e){ $('docs').textContent=e.message; flash(e.message,'error'); } }
async function deleteDoc(id) { try { await request(`/documents/${id}`,{method:'DELETE'}); await loadDocs(); flash('资料已删除'); } catch(e){flash(e.message,'error')} }
async function uploadDoc() { const file=$('document-file').files[0]; if(!file){flash('请选择 .md 或 .txt 文件','error');return;} try { const form=new FormData(); form.append('file',file); form.append('document_version','v1'); form.append('chunk_size','500'); form.append('overlap','50'); const data=await request('/documents/file',{method:'POST',body:form}); await loadDocs(); flash(`资料上传成功：${data.source}，生成 ${data.chunks_ingested} 个分块`); $('document-file').value=''; } catch(e){flash(e.message,'error')} }
async function ask() { const q=$('question').value.trim(); if(!q)return; $('chat').insertAdjacentHTML('beforeend',`<div class="bubble user">${escapeHtml(q)}</div>`); $('question').value=''; message('agent-msg','Agent 正在思考…'); try { const data=await request('/agent/chat',{method:'POST',body:JSON.stringify({message:q})}); $('chat').insertAdjacentHTML('beforeend',`<div class="bubble assistant">${escapeHtml(data.answer)}</div>`); $('trace').textContent=JSON.stringify(data.trace,null,2); renderProposals(data.pending_proposals||[]); flash(`回答完成：${data.tool_calls} 次工具调用`); } catch(e){flash(e.message,'error');message('agent-msg',e.message)} }
function renderProposals(items) { $('proposals').innerHTML=items.length?`<h3>待确认操作</h3>`+items.map(p=>`<div class="row"><div><strong>${escapeHtml(p.title)}</strong><span class="badge">${p.priority} · 待确认</span></div><div class="actions"><button onclick="confirmProposal('${p.id}')">确认创建</button><button class="danger" onclick="rejectProposal('${p.id}')">拒绝</button></div></div>`).join(''):''; }
async function confirmProposal(id){try{await request(`/agent/task-proposals/${id}/confirm`,{method:'POST'});await loadTasks();$('proposals').innerHTML='';flash('任务提案已确认');}catch(e){flash(e.message,'error')}} async function rejectProposal(id){try{await request(`/agent/task-proposals/${id}/reject`,{method:'POST'});$('proposals').innerHTML='';flash('任务提案已拒绝');}catch(e){flash(e.message,'error')}}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('login').onclick=login; $('register').onclick=()=>setAuthMode('register'); $('back-login').onclick=()=>setAuthMode('login'); $('logout').onclick=()=>{token=null;localStorage.removeItem('study_token');location.reload()}; $('refresh-tasks').onclick=loadTasks; $('refresh-docs').onclick=loadDocs; $('upload').onclick=uploadDoc; $('ask').onclick=ask; $('question').onkeydown=e=>{if(e.key==='Enter')ask()}; if(token)setLoggedIn();
</script>
</body>
</html>
